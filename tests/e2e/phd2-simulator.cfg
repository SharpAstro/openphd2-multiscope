; PHD2's settings on Linux (wxFileConfig, copied to ~/.PHDGuidingV2 before PHD2 starts): one
; profile using PHD2's built-in simulator camera and on-camera mount, with the event server on.
; Having a profile means PHD2 starts straight into its main window instead of the new-profile wizard,
; which would sit waiting on the virtual screen. Values come from a working Windows simulator profile.
ConfigVersion=2001
currentProfile=1
ServerMode=1
LoggingMode=1
[profile]
[profile/1]
name=Simulator
AutoLoadCalibration=0
DitherMode=0
DitherRaOnly=0
DitherScaleFactor=1
ExposureDurationMs=1000
[profile/1/camera]
LastMenuchoice=Simulator
pixelsize=3.75
binning=1
gain=95
AutoLoadDarks=0
AutoLoadDefectMap=0
[profile/1/frame]
focalLength=130
[profile/1/CalStepCalc]
GuideSpeed=0.5
[profile/1/guider/multistar]
enabled=1
[profile/1/scope]
LastMenuChoice=On-camera
LastAuxMenuChoice=None
CalibrationDuration=1700
CalibrationDistance=25
MaxRaDuration=2500
MaxDecDuration=2500
DecGuideMode=1
[profile/1/stepguider]
LastMenuChoice=None
[profile/1/rotator]
LastMenuChoice=None
