name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Patch component is github.run_number. MAJOR.MINOR lives in the repo-root Directory.Build.props
  # (VersionMajorMinor) and each job reads it back, so it cannot drift from what the binary declares.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The version step CAPTURES a dotnet invocation's stdout, so the SDK's first-run banner must not
  # be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test --project src/OpenPHD2MultiScope.Tests -c $BUILD_CONF --no-build

  # Two clients against the proxy in front of a real PHD2 (its simulator camera and mount, on a
  # virtual screen): greeting, queries, calibrating and guiding, one shared dither, a shared stop.
  # See tests/e2e/run.sh. About 5 minutes, most of it the simulator calibrating.
  e2e:
    runs-on: ubuntu-latest
    # PHD2's package needs libindi1, and the INDI package source only builds it for Ubuntu 26.04
    # (resolute) now, so the job runs in a 26.04 container rather than on the 24.04 runner.
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
    - name: Install PHD2, a virtual screen and the build prerequisites
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends software-properties-common gpg-agent ca-certificates curl git libicu-dev python3
        add-apt-repository -y ppa:mutlaqja/ppa
        add-apt-repository -y ppa:pch/phd2
        apt-get update
        apt-get install -y --no-install-recommends phd2 xvfb imagemagick
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build src/OpenPHD2MultiScope -c $BUILD_CONF
    - name: End-to-end checks
      run: bash tests/e2e/run.sh src/OpenPHD2MultiScope/bin/$BUILD_CONF/net10.0/openphd2-multiscope e2e-logs
    - name: Upload logs (PHD2's, the proxy's, a screenshot)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-logs
        path: e2e-logs
        retention-days: 5

  publish:
    needs: [ build, e2e ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    - name: Publish (native AOT)
      run: dotnet publish src/OpenPHD2MultiScope -c $BUILD_CONF -r ${{ matrix.rid }} -o publish -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Archive
      run: |
        cd publish
        rm -f *.pdb *.dbg
        cp ../README.md .
        if [[ "${{ matrix.rid }}" == win-* ]]; then
          7z a "../openphd2-multiscope-${VERSION_PREFIX}-${{ matrix.rid }}.zip" .
        else
          tar -czf "../openphd2-multiscope-${VERSION_PREFIX}-${{ matrix.rid }}.tar.gz" .
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: openphd2-multiscope-${{ matrix.rid }}
        path: openphd2-multiscope-*
        retention-days: 5

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "v${VERSION_PREFIX}" dist/* --target "${{ github.sha }}" --title "v${VERSION_PREFIX}" --generate-notes
